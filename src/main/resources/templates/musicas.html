<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spotif - Músicas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        h1 { margin-bottom: 12px; }
        form { margin-bottom: 24px; }
        label { display: block; margin: 6px 0 2px; }
        input, select { padding: 6px; width: 280px; }
        button { padding: 6px 12px; margin-top: 8px; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
        .music-card { border: 1px solid #ddd; border-radius: 6px; padding: 10px; }
        .music-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; background: #f2f2f2; }
        .row { display: flex; gap: 24px; flex-wrap: wrap; }
        .card { border: 1px solid #ddd; padding: 16px; border-radius: 6px; }
        .remove-form { display: inline; }
    </style>
</head>
<body>
<h1>Cadastro de Músicas</h1>

<div class="row">
    <div class="card">
        <h2>Adicionar</h2>
        <form th:action="@{/musicas}" th:object="${musicaForm}" method="post">
            <label for="id">ID</label>
            <input id="id" type="number" th:field="*{id}" required />

            <label for="titulo">Título</label>
            <input id="titulo" type="text" th:field="*{titulo}" required />

            <label for="artista">Artista</label>
            <input id="artista" type="text" th:field="*{artista}" required />

            <label for="ano">Ano</label>
            <input id="ano" type="number" th:field="*{ano}" required />

            <label for="ulrCapaDoAlbum">URL da capa</label>
            <input id="ulrCapaDoAlbum" type="text" th:field="*{ulrCapaDoAlbum}" />

            <label for="estilosMusical">Gênero</label>
            <select id="estilosMusical" th:field="*{estilosMusical}" required>
                <option value="" disabled selected>Selecione</option>
                <option th:each="g : ${generos}" th:value="${g}" th:text="${g}"></option>
            </select>

            <button type="submit">Salvar</button>
        </form>
    </div>

    <div class="card" style="min-width: 220px;">
        <h2>Remover por ID</h2>
        <form th:action="@{/musicas/remover}" method="post">
            <label for="removeId">ID</label>
            <input id="removeId" name="id" type="number" required />
            <button type="submit">Remover</button>
        </form>
    </div>

    <div class="card" style="min-width: 220px;">
        <h2>Buscar por ID</h2>
        <form th:action="@{/musicas/buscar}" method="post">
            <label for="buscarId">ID</label>
            <input id="buscarId" name="id" type="number" required />
            <button type="submit">Buscar</button>
        </form>
        <div th:if="${musicaBuscada != null}" style="margin-top: 12px;">
            <strong>Encontrada:</strong>
            <div th:text="${musicaBuscada.titulo}"></div>
            <small th:text="${musicaBuscada.artista}"></small>
        </div>
    </div>
</div>

<h2>Lista</h2>
<div class="cards">
    <div class="music-card" th:each="m : ${musicas}">
        <img th:if="${m.ulrCapaDoAlbum != null && !#strings.isEmpty(m.ulrCapaDoAlbum)}"
             th:src="${m.ulrCapaDoAlbum}" alt="Capa do álbum" />
        <div style="margin-top: 8px;">
            <strong th:text="${m.titulo}"></strong>
            <div th:text="${m.artista}"></div>
            <small>
                <span th:text="${m.ano}"></span> • <span th:text="${m.estilosMusical}"></span>
            </small>
        </div>
    </div>
    <div class="music-card" th:if="${musicas == null || #lists.isEmpty(musicas)}">
        Nenhuma música cadastrada.
    </div>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Artista</th>
        <th>Ano</th>
        <th>Gênero</th>
        <th>Capa</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="m : ${musicas}">
        <td th:text="${m.id}"></td>
        <td th:text="${m.titulo}"></td>
        <td th:text="${m.artista}"></td>
        <td th:text="${m.ano}"></td>
        <td th:text="${m.estilosMusical}"></td>
        <td>
            <a th:if="${m.ulrCapaDoAlbum != null && !#strings.isEmpty(m.ulrCapaDoAlbum)}"
               th:href="${m.ulrCapaDoAlbum}" target="_blank">abrir</a>
        </td>
    </tr>
    <tr th:if="${musicas == null || #lists.isEmpty(musicas)}">
        <td colspan="6">Nenhuma música cadastrada.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
